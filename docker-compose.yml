version: "3.8"

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: chat-db-postgres
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret_password_pg
      POSTGRES_DB: auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat-network

  mongodb:
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: chat-db-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: chat_messages_db
    volumes:
      - mongodata:/data/db
    networks:
      - chat-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: ./server
    container_name: chat-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    command: sh -c "npx sequelize-cli db:migrate && npx migrate-mongo up && node index.js"
    environment:
      DATABASE_URL: postgres://user_admin:secret_password_pg@db:5432/auth_db
      MONGO_URI: mongodb://mongodb:27017/chat_messages_db
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - db
      - mongodb
    networks:
      - chat-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build: ./client
    container_name: chat-frontend
    ports:
      - "80"
    depends_on:
      - server
    networks:
      - chat-network

  gateway:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81" # Админка для настройки HTTPS
      - "443:443" # Тот самый порт для HTTPS
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - chat-network

volumes:
  pgdata:
  mongodata:

networks:
  chat-network:
    driver: bridge

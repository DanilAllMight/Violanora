version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: chat-db-postgres
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret_password_pg
      POSTGRES_DB: auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat-network

  mongodb:
    image: mongo:latest
    container_name: chat-db-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: chat_messages_db
    volumes:
      - mongodata:/data/db
    networks:
      - chat-network

  server:
    build: ./server
    container_name: chat-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://user_admin:secret_password_pg@db:5432/auth_db
      MONGO_URI: mongodb://mongodb:27017/chat_messages_db
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - db
      - mongodb
    networks:
      - chat-network

  client:
    build: ./client
    container_name: chat-frontend
    ports:
      - "80"
    depends_on:
      - server
    networks:
      - chat-network

  gateway:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81" # Админка для настройки HTTPS
      - "443:443" # Тот самый порт для HTTPS
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - chat-network

volumes:
  pgdata:
  mongodata:

networks:
  chat-network:
    driver: bridge
